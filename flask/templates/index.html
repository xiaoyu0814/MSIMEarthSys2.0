<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>风场数据生成服务</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
      }
      .header {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 12px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      .header h1 {
        color: #2c3e50;
        margin-bottom: 10px;
      }
      .header p {
        color: #7f8c8d;
      }
      .main-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
      }
      .card {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      }
      .card h2 {
        color: #2c3e50;
        margin-bottom: 20px;
        border-bottom: 2px solid #667eea;
        padding-bottom: 10px;
      }
      .script-item {
        background: #f8f9fa;
        border: 1px solid #e9ecef;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 12px;
        transition: all 0.3s ease;
      }
      .script-item:hover {
        border-color: #667eea;
        box-shadow: 0 2px 8px rgba(102, 126, 234, 0.1);
      }
      .script-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .script-name {
        font-weight: 600;
        color: #2c3e50;
        font-size: 1.05em;
      }
      .script-desc {
        color: #7f8c8d;
        font-size: 0.9em;
        margin-bottom: 12px;
      }
      .script-output {
        color: #667eea;
        font-size: 0.85em;
        margin-bottom: 12px;
        font-family: monospace;
      }
      .btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9em;
        font-weight: 500;
        transition: all 0.3s ease;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }
      .btn:disabled {
        background: #bdc3c7;
        cursor: not-allowed;
        transform: none;
      }
      .status-indicator {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 8px;
      }
      .status-idle {
        background: #95a5a6;
      }
      .status-running {
        background: #f39c12;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      .console {
        background: #1e1e1e;
        color: #d4d4d4;
        border-radius: 8px;
        padding: 16px;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 0.9em;
        max-height: 400px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .console-error {
        color: #e74c3c;
      }
      .console-success {
        color: #2ecc71;
      }
      .file-list {
        max-height: 400px;
        overflow-y: auto;
      }
      .file-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        border-bottom: 1px solid #e9ecef;
      }
      .file-item:last-child {
        border-bottom: none;
      }
      .file-name {
        font-family: monospace;
        color: #2c3e50;
      }
      .file-size {
        color: #7f8c8d;
        font-size: 0.85em;
      }
      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.8em;
        margin-right: 6px;
      }
      .badge-python {
        background: #3776ab;
        color: white;
      }
      .badge-json {
        background: #2ecc71;
        color: white;
      }
      .section-full {
        grid-column: 1 / -1;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      .tab {
        padding: 8px 16px;
        background: #f8f9fa;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .tab.active {
        background: #667eea;
        color: white;
      }
      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }
      @media (max-width: 900px) {
        .main-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🌪️ 风场数据生成服务</h1>
        <p>
          基于原始数据：wind3d2_radar_taipei.json | 运行脚本生成各种风场数据
        </p>
      </div>

      <div class="main-grid">
        <div class="card">
          <h2>🔧 生成脚本</h2>
          <div class="tabs">
            <button class="tab active" onclick="showTab('all')">全部</button>
            <button class="tab" onclick="showTab('split')">数据划分</button>
            <button class="tab" onclick="showTab('route')">路线生成</button>
            <button class="tab" onclick="showTab('shear')">风切变</button>
          </div>

          <div class="tab-content active" id="tab-all">
            <div id="script-list-all"></div>
          </div>
          <div class="tab-content" id="tab-split">
            <div id="script-list-split"></div>
          </div>
          <div class="tab-content" id="tab-route">
            <div id="script-list-route"></div>
          </div>
          <div class="tab-content" id="tab-shear">
            <div id="script-list-shear"></div>
          </div>
        </div>

        <div class="card">
          <h2>📋 执行结果</h2>
          <div id="status-section">
            <span
              class="status-indicator status-idle"
              id="status-indicator"
            ></span>
            <span id="status-text">就绪</span>
          </div>
          <h3 style="margin-top: 16px">控制台输出：</h3>
          <div class="console" id="console-output">等待执行脚本...</div>
        </div>

        <div class="card section-full">
          <h2>📁 生成的文件</h2>
          <div class="file-list" id="file-list">
            <p style="color: #7f8c8d">加载文件列表...</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      let scripts = {}

      // 分类脚本
      function categorizeScripts() {
        return {
          split: ['split_wind_data', 'split_wind_part4', 'split_taipei_nine'],
          route: [
            'extract_single_route',
            'extract_single_route_v2',
            'gen_wind_shapes',
            'gen_wind_real',
            'gen_red_route_v3',
            'gen_long_snake'
          ],
          shear: [
            'gen_wind_shear',
            'gen_small_eddies_vertical',
            'gen_extreme_winding_vertical',
            'gen_interleaved_vertical'
          ]
        }
      }

      // 渲染脚本列表
      function renderScripts(scriptKeys, containerId) {
        const container = document.getElementById(containerId)
        let html = ''

        scriptKeys.forEach((key) => {
          const script = scripts[key]
          html += `
                    <div class="script-item">
                        <div class="script-header">
                            <span class="script-name">${script.name}</span>
                            <span class="badge badge-python">Python</span>
                        </div>
                        <div class="script-desc">${script.description}</div>
                        <div class="script-output">
                            📄 输出: ${script.output.join(', ')}
                        </div>
                        <button class="btn" onclick="runScript('${key}')" id="btn-${key}">
                            ▶️ 执行
                        </button>
                    </div>
                `
        })

        container.innerHTML = html
      }

      // 加载脚本列表
      async function loadScripts() {
        try {
          const response = await fetch('/api/scripts')
          scripts = await response.json()

          const categories = categorizeScripts()

          renderScripts(Object.keys(scripts), 'script-list-all')
          renderScripts(categories.split, 'script-list-split')
          renderScripts(categories.route, 'script-list-route')
          renderScripts(categories.shear, 'script-list-shear')
        } catch (error) {
          console.error('Error loading scripts:', error)
        }
      }

      // 显示标签页
      function showTab(tab) {
        document
          .querySelectorAll('.tab')
          .forEach((el) => el.classList.remove('active'))
        document
          .querySelectorAll('.tab-content')
          .forEach((el) => el.classList.remove('active'))

        event.target.classList.add('active')
        document.getElementById('tab-' + tab).classList.add('active')
      }

      // 运行脚本
      async function runScript(key) {
        const btn = document.getElementById('btn-' + key)
        const statusIndicator = document.getElementById('status-indicator')
        const statusText = document.getElementById('status-text')
        const consoleOutput = document.getElementById('console-output')

        try {
          btn.disabled = true
          btn.textContent = '⏳ 执行中...'
          statusIndicator.className = 'status-indicator status-running'
          statusText.textContent = `正在执行: ${scripts[key].name}`
          consoleOutput.innerHTML = `🚀 开始执行: ${scripts[key].name}\n`

          const response = await fetch('/api/run-script', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ script_key: key })
          })

          const result = await response.json()

          if (result.stdout) {
            consoleOutput.innerHTML += `<span class="console-success">${result.stdout}</span>\n`
          }

          if (result.stderr) {
            consoleOutput.innerHTML += `<span class="console-error">${result.stderr}</span>\n`
          }

          if (result.success) {
            consoleOutput.innerHTML += `\n✅ 执行成功!\n输出文件: ${result.output_files.join(
              ', '
            )}`
          } else {
            consoleOutput.innerHTML += `\n❌ 执行失败!`
          }

          await loadFileList()
        } catch (error) {
          consoleOutput.innerHTML += `\n<span class="console-error">❌ 错误: ${error.message}</span>`
        } finally {
          btn.disabled = false
          btn.textContent = '▶️ 执行'
          statusIndicator.className = 'status-indicator status-idle'
          statusText.textContent = '就绪'
        }
      }

      // 加载文件列表
      async function loadFileList() {
        try {
          const response = await fetch('/api/files')
          const result = await response.json()

          const container = document.getElementById('file-list')

          if (result.files.length === 0) {
            container.innerHTML = '<p style="color: #7f8c8d;">没有文件</p>'
            return
          }

          let html = ''
          result.files.forEach((file) => {
            const sizeKB = (file.size / 1024).toFixed(2)
            html += `
                        <div class="file-item">
                            <div>
                                <span class="badge badge-json">JSON</span>
                                <span class="file-name">${file.name}</span>
                            </div>
                            <span class="file-size">${sizeKB} KB</span>
                        </div>
                    `
          })

          container.innerHTML = html
        } catch (error) {
          console.error('Error loading file list:', error)
        }
      }

      // 初始化
      document.addEventListener('DOMContentLoaded', async () => {
        await loadScripts()
        await loadFileList()
      })
    </script>
  </body>
</html>
